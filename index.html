<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Morse Tree</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="app-layout">
            <div id="left-panel">
                <div id="sentence-display"></div>

                <div id="left-panel-bottom">
                    <div id="morse-key">
                        <div id="key-code-display"></div>
                        <div id="key-letter-display"></div>
                    </div>

                    <div id="keyboard">
                        <button id="btn-backspace">Backspace</button>
                        <button id="btn-clear">Clear</button>
                    </div>
                </div>
            </div>

            <div id="right-panel">
                <div id="tree-area"></div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
